<style>
:root{
  --bg:#F6F4EE; --bg-card:#FFFFFF; --bg-soft:#EFEBE2;
  --text:#332B22; --text-soft:#6B6253; --text-faint:#9A9182;
  --border:#E3DDD0;
  --success-bg:#E3F3EA; --success-text:#1F6B40;
  --danger-bg:#FBE7E4; --danger-text:#9B3A2C;
  --warning-bg:#FBF0DD; --warning-text:#8A5A12;
  --ressecado-bg:#FFF6CC; --ressecado-text:#9A7B00;
  --info-bg:#E6EEF8; --info-text:#2C5C8A;
  --radius-lg:26px; --radius-md:16px; --radius-sm:12px;
  --font-display:'Baloo 2', sans-serif;
  --font-body:'Atkinson Hyperlegible', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16130F; --bg-card:#211C16; --bg-soft:#2A241C;
    --text:#F2EDE3; --text-soft:#C7BEAE; --text-faint:#8C8374;
    --border:#3A332A;
    --success-bg:#163524; --success-text:#7FD9A4;
    --danger-bg:#3A1F1B; --danger-text:#F2A493;
    --warning-bg:#3A2C12; --warning-text:#F0C674;
    --ressecado-bg:#3A3000; --ressecado-text:#F5DD55;
    --info-bg:#1B2C3D; --info-text:#9CC4EC;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  min-height:100vh; background:var(--bg); color:var(--text);
  font-family:var(--font-body); display:flex; justify-content:center;
  padding:28px 14px 60px; -webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit;}
button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline:3px solid var(--text); outline-offset:2px;
}
button{
  border:1px solid var(--border); background:var(--bg-card); color:var(--text);
  border-radius:var(--radius-sm); padding:11px 14px; font-size:14px; cursor:pointer; min-height:44px;
}
button:disabled{opacity:0.5; cursor:default;}
input[type=text],input[type=time],textarea{
  width:100%; border:1px solid var(--border); background:var(--bg-card); color:var(--text);
  border-radius:var(--radius-sm); padding:10px 12px; font-size:14px;
}
textarea{resize:none;}
p{margin:0;}
.app{width:100%; max-width:460px;}
.eyebrow{font-size:12px; letter-spacing:0.04em; color:var(--text-faint); text-transform:uppercase; margin:0 0 4px;}
.title{font-family:var(--font-display); font-weight:700; font-size:30px; margin:0 0 4px; line-height:1.1;}
.subtitle{color:var(--text-soft); font-size:14px; margin:0 0 20px;}
.card{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px;}
.seg-row{display:flex; gap:4px; margin-bottom:16px; flex-wrap:wrap;}
.seg-btn{flex:1; min-width:60px; text-align:center; padding:8px 2px; border-radius:var(--radius-sm); font-size:11px; cursor:pointer; border:1px solid var(--border); background:var(--bg-card); display:flex; flex-direction:column; align-items:center; gap:3px; min-height:48px; justify-content:center;}
.seg-btn.active{background:var(--bg-soft); font-weight:700;}
.seg-btn i{font-size:16px;}
.theme-row{display:flex; gap:7px; margin-bottom:18px; flex-wrap:wrap;}
.theme-chip{width:64px; height:64px; border-radius:var(--radius-md); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; border:2px solid transparent; font-size:18px;}
.theme-chip.selected{border-color:var(--text);}
.day-dot{width:25px; height:25px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text-soft); border:1px solid var(--border); flex-shrink:0;}
.allergy-chip{font-size:12px; padding:7px 11px; border-radius:var(--radius-sm); min-height:36px;}
.step-btn{width:100%; display:flex; align-items:center; gap:10px; justify-content:flex-start; margin-bottom:7px; text-align:left;}
.avatar{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.section-label{font-size:13px; font-weight:700; margin:0 0 8px;}
.tiny{font-size:11px; color:var(--text-faint);}
.loading-wrap{display:flex; align-items:center; justify-content:center; min-height:50vh; width:100%;}
.loading-text{color:var(--text-soft); font-size:14px;}
.footer-note{text-align:center; font-size:11px; color:var(--text-faint); margin-top:16px;}
.deco-icon{position:absolute; top:-14px; right:-10px; font-size:92px; opacity:0.14; transform:rotate(-12deg); pointer-events:none;}
.theme-card{position:relative; overflow:hidden; border-radius:var(--radius-lg); padding:16px; margin-bottom:14px;}
@keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }
.breath-creature{ animation:breathe 8s ease-in-out infinite; transform-origin:center; }
@media (prefers-reduced-motion: reduce){ .breath-creature{ animation:none; } }
@media print{
  .seg-row, #rewards-row, .eyebrow, .title, .subtitle, .footer-note, #theme-row, #theme-label,
  #kid-view, #sleep-view, #play-view, #supplements-view, #label-view, #bowel-view, #restaurant-view, #pause-view, #mom-view, #print-btn{ display:none !important; }
  #report-view{ display:block !important; }
  body{ padding:0 !important; background:#fff !important; }
  #app-card{ background:#fff !important; }
  #theme-bg-deco{ display:none !important; }
  .card{ border:none; padding:0; }
}
</style>
</head>

function formatSyncTime(iso){
  if(!iso) return null;
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
  return sameDay ? `hoje às ${hh}:${mm}` : `${d.toLocaleDateString('pt-BR')} às ${hh}:${mm}`;

function getOrCreateDeviceId(){

    return id;

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

function pushStatusMessage(){
  if(!PUSH_SUPPORTED) return 'Este navegador não tem suporte a notificações. No iPhone, adicione o app à Tela de Início primeiro e abra por lá.';
  if(pushState.denied) return 'A notificação foi bloqueada nas configurações do navegador/celular. Ative manualmente para o app funcionar.';
  if(pushState.error) return 'Não deu pra ativar agora: ' + pushState.error;
  if(pushState.subscribed){
    const lastSync = formatSyncTime(getLastPushSync());
    return lastSync

async function initPush(){
  if(!PUSH_SUPPORTED){ pushState.checking = false; return; }
  try{
    const reg = await navigator.serviceWorker.register('/sw.js');
    const sub = await reg.pushManager.getSubscription();
    pushState.subscribed = !!sub;
    pushState.denied = Notification.permission === 'denied';
  }catch(e){
    pushState.error = e.message;
  }
  pushState.checking = false;
  renderMomView();
  if(pushState.subscribed) syncPushSchedule();
}

async function onPushButtonClick(){
  if(!PUSH_SUPPORTED) return;
  if(pushState.subscribed){
    await disablePush();
  }else{
    await enablePush();
  }

}

async function enablePush(){
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      pushState.denied = (permission === 'denied');
      renderMomView();
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    pushState.subscribed = true;
    pushState.error = null;
    await syncPushSchedule(true);
  }catch(e){
    pushState.error = e.message;
  }
}

async function disablePush(){
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      await fetch('/.netlify/functions/unsubscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ deviceId: getOrCreateDeviceId() })
      }).catch(() => {});
      await sub.unsubscribe();
    }
    pushState.subscribed = false;
  }catch(e){
    pushState.error = e.message;
  }
}

function syncPushSchedule(immediate){
  if(!PUSH_SUPPORTED || !pushState.subscribed) return;
  clearTimeout(pushSyncTimer);
  const run = async () => {
    try{
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if(!sub) { pushState.subscribed = false; return; }
      const res = await fetch('/.netlify/functions/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          deviceId: getOrCreateDeviceId(),
          subscription: sub.toJSON(),
          childName: getGuideName(state.theme),
          meals: state.meals.map(m => ({ id: m.id, label: m.label, time: m.time })),
          mealsDoneCount: state.meal,

          supplementsTaken: state.supplementsTaken,
          supplementsLastTaken: state.supplementsLastTaken,
          supplementsCreatedAt: state.supplementsCreatedAt
        })
      });
      if(res.ok){
        setLastPushSync(new Date().toISOString());
        renderMomView();
      }
    }catch(e){ /* sem internet no momento; tenta de novo na próxima mudança */ }
  };
  if(immediate) run(); else pushSyncTimer = setTimeout(run, 1200);
}

function normalizeFoodText(s){
  return (s || '').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}

function splitMealItems(text){
  return (text || '').split(',').map(s => s.trim()).filter(Boolean);
}

function matchFoodEmojis(phrase){
  const norm = normalizeFoodText(phrase);
  if(!norm) return [];
  if(FOOD_EMOJI[norm]) return [FOOD_EMOJI[norm]];
  const found = [];
  const seen = new Set();
  const multiWordKeys = Object.keys(FOOD_EMOJI).filter(k => k.includes(' ')).sort((a,b) => b.length - a.length);
  for(const key of multiWordKeys){
    if(norm.includes(key) && !seen.has(FOOD_EMOJI[key])){
      found.push(FOOD_EMOJI[key]);
      seen.add(FOOD_EMOJI[key]);
    }
  }
  const words = norm.split(/[^a-z0-9]+/).filter(Boolean);
  for(const w of words){
    if(FOOD_EMOJI[w] && !seen.has(FOOD_EMOJI[w])){
      found.push(FOOD_EMOJI[w]);
      seen.add(FOOD_EMOJI[w]);
    }
  }
  return found;
}

function getLast7Days(){
  const out = []; const todayStr = localDateStr(new Date());
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = localDateStr(d);
    const letters = ['D','S','T','Q','Q','S','S'];
    out.push({ dateStr:ds, letter:letters[d.getDay()], done: state.history[ds] === true, isToday: ds === todayStr });
  }
  return out;
}
function formatEntryDate(dateStr){
  const todayStr = localDateStr(new Date());
  if(dateStr === todayStr) return 'Hoje';
  const parts = dateStr.split('-');
  return `${parts[2]}/${parts[1]}`;
}

function getCurrentWeekDates(){
  const today = new Date();
  const dow = today.getDay();
  const mondayOffset = dow === 0 ? 6 : dow - 1;
  const monday = new Date(today); monday.setDate(today.getDate() - mondayOffset);
  const todayStr = localDateStr(today);
  const out = [];
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const ds = localDateStr(d);
    out.push({ dateStr:ds, letter:WEEKDAY_LETTERS_MON_FIRST[i], isToday: ds === todayStr, isFuture: d > today });
  }
  return out;
}

function getDayLog(dateStr){

    };

  if(state.dailyLog && state.dailyLog[dateStr]) return state.dailyLog[dateStr];
  const bowelDay = state.bowel.byDate[dateStr];
  return { water:0, meal:0, momWater:0, momMeal:0, bowelCount: bowelDay ? bowelDay.count : 0, bowelNote: bowelDay ? bowelDay.note : null, challengeCompleted:false };
}

function getWeekChallengeStars(){
  const days = getCurrentWeekDates();

let audioCtx = null;
function unlockAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ /* sem suporte */ }
  }else if(audioCtx.state === 'suspended'){
    audioCtx.resume().catch(()=>{});
  }
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);

function playChime(styleKey){
  if(!audioCtx) return;
  const style = SOUND_STYLES[styleKey || state.soundStyle] || SOUND_STYLES.suave;
  try{
    const t0 = audioCtx.currentTime;
    style.notes.forEach(([freq, offset]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      const start = t0 + offset;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(style.gainPeak, start+0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, start+style.noteDur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(start); o.stop(start+style.noteDur+0.05);
    });
  }catch(e){ console.log('Som indisponível', e); }
}

function timeToMinutes(t){ const parts = (t||'00:00').split(':'); return (Number(parts[0])*60) + Number(parts[1]); }
function nowMinutes(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }

// Calcula o próximo horário (data+hora completos) em que um suplemento está previsto,
// considerando quando ele foi tomado pela última vez — assim um remédio de 22h, 6h e 14h
// (tomado em dias/horários diferentes) só toca de novo na sua PRÓXIMA ocorrência real,
// e não fica "atrasado" só porque o relógio já passou daquele horário hoje.
// Calcula o próximo horário (data+hora completos) em que um suplemento está previsto.
// Usa uma referência FIXA (a última vez que foi tomado, ou a data em que foi cadastrado)
// em vez de recalcular a partir de "agora" a cada checagem — isso evita que o aviso fique
// sendo empurrado pra amanhã pra sempre, e também evita tocar para horários que já tinham
// passado no dia em que o suplemento foi cadastrado.
function nextSupplementDue(s){
  const [hh, mm] = (s.time || '08:00').split(':').map(Number);
  const last = state.supplementsLastTaken ? state.supplementsLastTaken[s.id] : null;
  const createdAt = state.supplementsCreatedAt ? state.supplementsCreatedAt[s.id] : null;
  const anchorIso = last || createdAt;
  const anchorDate = anchorIso ? new Date(anchorIso) : new Date(Date.now() - 25*60*60*1000);
  const due = new Date(anchorDate);
  due.setHours(hh, mm, 0, 0);
  if(due.getTime() <= anchorDate.getTime()) due.setDate(due.getDate() + 1);
  return due;
}

function checkAlerts(){
  const nm = nowMinutes();
  state.meals.forEach((m,i) => {
    if(state.meal > i) return;
    if(nm >= timeToMinutes(m.time)){
      if(state.soundEnabled && audioCtx) playChime('refeicao');
    }
  });

  state.supplements.forEach(s => {
    if(state.supplementsTaken[s.id]) return;
    const due = nextSupplementDue(s);
    if(Date.now() >= due.getTime()){
      if(state.soundEnabled && audioCtx) playChime('suplemento');
    }
  });
}
function toggleSound(){ state.soundEnabled = !state.soundEnabled; renderMomView(); scheduleSave(); }
function testSound(kind){ unlockAudio(); playChime(kind); }

let oceanNodes = null;
function startOcean(){
  unlockAudio();
  if(!audioCtx || oceanNodes) return;
  try{
    const bufferSize = 2 * audioCtx.sampleRate;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    let lastOut = 0;
    for(let i=0;i<bufferSize;i++){
      const white = Math.random()*2-1;
      lastOut = (lastOut + 0.02*white) / 1.02;
      data[i] = lastOut * 3.5;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer; noise.loop = true;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 600;

    const gainNode = audioCtx.createGain();
    gainNode.gain.value = 0.16;

    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.12;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.07;
    lfo.connect(lfoGain);
    lfoGain.connect(gainNode.gain);

    noise.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    noise.start();
    lfo.start();
    oceanNodes = { noise, filter, gainNode, lfo, lfoGain };
    renderPauseView();
  }catch(e){ console.log('Som do mar indisponível', e); }
}
function stopOcean(){
  if(!oceanNodes) return;
  try{
    oceanNodes.noise.stop(); oceanNodes.lfo.stop();
    oceanNodes.noise.disconnect(); oceanNodes.filter.disconnect();
    oceanNodes.gainNode.disconnect(); oceanNodes.lfo.disconnect(); oceanNodes.lfoGain.disconnect();
  }catch(e){}
  oceanNodes = null;
  renderPauseView();
}

let breathInterval = null;
function startBreathCycle(){
  if(breathInterval) clearInterval(breathInterval);
  let inspire = true;
  const setLabel = () => {
    const el = document.getElementById('breath-label');
    if(el) el.textContent = inspire ? 'Inspire pelo nariz...' : 'Solte bem devagar...';
  };
  setLabel();
  breathInterval = setInterval(() => { inspire = !inspire; setLabel(); }, 4000);
}

function buildSpiralPath(turns, maxR, cx, cy, steps){
  let d = '';
  for(let i=0;i<=steps;i++){
    const tt = i/steps;
    const theta = tt * turns * 2 * Math.PI;
    const r = tt * maxR;
    const x = cx + r * Math.cos(theta - Math.PI/2);
    const y = cy + r * Math.sin(theta - Math.PI/2);
    d += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2) + ' ';
  }
  return d;
}

function renderMenuView(){
  const t = THEMES[state.theme], name = getGuideName(state.theme);
  const blocks = state.meals.map(m => {
    const raw = (state.mealPreview && state.mealPreview[m.id]) || '';
    const items = splitMealItems(raw);
    if(!items.length) return '';
    const cards = items.map(item => {
      const emojis = matchFoodEmojis(item);
      const display = emojis.length ? emojis.join('') : FOOD_GENERIC_EMOJI;
      return `<div style="width:100px;background:var(--bg-card);border-radius:var(--radius-md);padding:12px 6px;text-align:center;">
        <div style="font-size:34px;">${display}</div>
        <div style="font-size:12px;font-weight:700;color:var(--text);margin-top:4px;">${item}</div>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:20px;">
      <p style="text-align:center;font-size:19px;font-weight:800;color:${t.accent};margin-bottom:12px;">${m.label}</p>
      <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">${cards}</div>
    </div>`;
  }).filter(Boolean).join('');

  document.getElementById('menu-view').innerHTML = `
    <p class="section-label">👀 Previsão do que vem por aí</p>
    ${blocks || `<div style="text-align:center;padding:30px 16px;color:var(--text-soft);">
      <i class="ti ti-tools-kitchen-2" style="font-size:40px;" aria-hidden="true"></i>
      <p style="margin-top:10px;">Ainda não tem nenhuma refeição prevista. Peça para a Mamãe preencher em Mãe/Cuidador → Previsão do prato!</p>
    </div>`}
  `;
}

function scheduleSave(){
  syncPushSchedule();
  if(!hasStorage) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ console.error('Erro ao salvar dados', e); }
  }, 400);
}

async function loadState(){
  if(hasStorage){
    try{
      const raw = window.localStorage.getItem(STORAGE_KEY);
      const result = raw ? { value: raw } : null;
      if(result && result.value){
        const saved = JSON.parse(result.value);
        state = Object.assign(makeDefaultState(), saved);
        state.waterGoal = 10;
        if(!Array.isArray(state.meals) || state.meals.length !== 6) state.meals = makeDefaultState().meals;
        state.meals.forEach(m => { if(!m.icon) m.icon = MEAL_ICONS[m.id] || 'ti-tools-kitchen-2'; });
        if(!state.foods || Object.keys(state.foods).length === 0) state.foods = makeDefaultState().foods;
        if(!state.challenge || typeof state.challenge !== 'object'){
          state.challenge = { food: Object.keys(state.foods)[0], selected: null };
        }else if(Array.isArray(state.challenge.stepDone)){
          const idx = state.challenge.stepDone.findIndex(Boolean);
          state.challenge = { food: state.challenge.food || Object.keys(state.foods)[0], selected: idx >= 0 ? idx : null };
        }
        if(typeof state.challenge.selected === 'undefined') state.challenge.selected = null;
        if(typeof state.challengeFeedback === 'undefined') state.challengeFeedback = null;
        if(!state.foods[state.challenge.food]) state.challenge.food = Object.keys(state.foods)[0];
        if(!state.sleep || !Array.isArray(state.sleep.stepDone) || state.sleep.stepDone.length !== SLEEP_STEPS.length){
          state.sleep = { stepDone: new Array(SLEEP_STEPS.length).fill(false) };
        }
        if(!state.chew) state.chew = { active:false, count:0, goalMin:20, goalMax:30 };
        state.chew.goalMin = 20; state.chew.goalMax = 30;
        if(typeof state.chewCompletions !== 'number') state.chewCompletions = 0;
        if(typeof state.sleepRoundsToday !== 'number') state.sleepRoundsToday = 0;
        if(typeof state.challengeRoundsToday !== 'number') state.challengeRoundsToday = 0;
        if(!state.bowel || !state.bowel.byDate){
          const byDate = {};
          ((state.bowel && state.bowel.entries) || []).forEach(e => {
            if(!byDate[e.date]) byDate[e.date] = { count:0, note: (NOTE_OPTIONS[e.note] ? e.note : 'normal') };
            byDate[e.date].count = Math.min(5, byDate[e.date].count + 1);
          });
          state.bowel = { byDate, noteSel: (state.bowel && state.bowel.noteSel && NOTE_OPTIONS[state.bowel.noteSel]) ? state.bowel.noteSel : 'normal' };
        }
        if(!NOTE_OPTIONS[state.bowel.noteSel]) state.bowel.noteSel = 'normal';
        if(!state.dailyLog) state.dailyLog = {};
        if(!Array.isArray(state.restaurants)) state.restaurants = [];
        if(!state.history) state.history = {};
        if(!THEMES[state.theme]) state.theme = 'dino';
        if(typeof state.momWater !== 'number') state.momWater = 0;
        state.momWaterGoal = 10;
        if(typeof state.momMeal !== 'number') state.momMeal = 0;
        state.momMealGoal = 6;
        if(!Array.isArray(state.supplements)) state.supplements = [];
        if(!state.supplementsTaken) state.supplementsTaken = {};
        if(!state.supplementsLastTaken) state.supplementsLastTaken = {};
        if(!state.supplementsCreatedAt) state.supplementsCreatedAt = {};
        state.supplements.forEach(s => {
          if(!state.supplementsCreatedAt[s.id]){
            state.supplementsCreatedAt[s.id] = new Date(Date.now() - 25*60*60*1000).toISOString();
          }
        });
        if(typeof state.soundEnabled !== 'boolean') state.soundEnabled = true;
        if(!SOUND_STYLES[state.soundStyle]) state.soundStyle = 'suave';
        if(!state.customAllergens) state.customAllergens = {};
        if(!state.alertsFiredToday || !Array.isArray(state.alertsFiredToday.meals)){
          state.alertsFiredToday = { meals: new Array(state.meals.length).fill(false), supplements:{} };
        }
      }
    }catch(e){ console.log('Nenhum dado salvo ainda, usando padrão.'); }
  }

  if(!state.restaurantsSeeded && state.restaurants.length === 0){
    const seedDate = localDateStr(new Date());
    state.restaurants = SEED_RESTAURANTS.map(r => Object.assign({ date: seedDate, seeded:true }, r));
    state.restaurantsSeeded = true;
  }

  rolloverIfNewDay();

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app-root').style.display = 'block';
  renderAll();
  scheduleSave();
  checkAlerts();
  setInterval(checkAlerts, 30000);
  setInterval(() => { if(rolloverIfNewDay()){ renderAll(); scheduleSave(); } }, 60000);
}

function rolloverIfNewDay(){
  const todayStr = localDateStr(new Date());
  if(!state.lastDate || state.lastDate === todayStr){
    state.lastDate = todayStr;
    return false;
  }
  const oldDate = state.lastDate;
  state.history[oldDate] = (state.water >= state.waterGoal && state.meal >= state.meals.length);
  const oldBowel = state.bowel.byDate[oldDate];
  state.dailyLog[oldDate] = {
    water: state.water, meal: state.meal, momWater: state.momWater, momMeal: state.momMeal,
    bowelCount: oldBowel ? oldBowel.count : 0, bowelNote: oldBowel ? oldBowel.note : null,
    challengeCompleted: state.challengeRoundsToday > 0, challengeFeedback: state.challengeFeedback
  };
  state.water = 0; state.meal = 0;
  state.sleep.stepDone = new Array(SLEEP_STEPS.length).fill(false);
  state.challenge.selected = null;
  state.challengeFeedback = null;
  state.chew.count = 0;
  state.sleepRoundsToday = 0; state.challengeRoundsToday = 0; state.chewCompletions = 0;
  state.lastCheck = null;
  state.momWater = 0; state.momMeal = 0;
  state.supplementsTaken = {};
  state.alertsFiredToday = { meals: new Array(state.meals.length).fill(false), supplements:{} };
  state.lastDate = todayStr;
  return true;
}

async function resetData(){
  if(!confirm('Tem certeza? Isso vai apagar todo o progresso salvo neste link.')) return;
  if(hasStorage){ try{ window.localStorage.removeItem(STORAGE_KEY); }catch(e){} }
  state = makeDefaultState();
  state.lastDate = localDateStr(new Date());
  renderAll();
  scheduleSave();
}

function getGuideName(id){ return state.guideNames[id] || THEMES[id].defaultName; }
function currentPoints(){
  const supplementsToday = Object.values(state.supplementsTaken).filter(Boolean).length;
  return state.water + state.meal + (state.sleepRoundsToday*2) + (state.challengeRoundsToday*2) + state.chewCompletions + supplementsToday;
}

function progressRow(count, goal, accent, icon, onClickName){
  let html = '';
  for(let i=0;i<goal;i++){
    const filled = i < count;
    const base = `width:26px;height:26px;min-height:26px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;${filled ? `background:${accent};color:#fff;border:none;` : `background:var(--bg-soft);color:var(--text-faint);border:1px solid var(--border);`}`;
    if(onClickName){
      html += `<button type="button" onclick="${onClickName}(${i})" style="${base}cursor:pointer;" aria-label="Marcar até o item ${i+1}"><i class="ti ${icon}" aria-hidden="true"></i></button>`;
    }else{
      html += `<div style="${base}"><i class="ti ${icon}" aria-hidden="true"></i></div>`;
    }
  }
  return html;
}

function renderRewards(){
  const t = THEMES[state.theme];
  const points = currentPoints();
  const cap = 40;
  const starsHtml = Array.from({length: Math.min(points, cap)}).map(() =>
    `<div style="width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:${t.accent};color:#fff;flex-shrink:0;"><i class="ti ti-star" aria-hidden="true"></i></div>`
  ).join('');
  document.getElementById('rewards-row').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <span style="font-size:14px;font-weight:700;">${points} estrela${points === 1 ? '' : 's'} hoje</span>
    </div>
    <div style="display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap;align-items:center;">
      ${points === 0 ? `<p class="tiny" style="margin:0;">Cada coisinha feita hoje vai virando uma estrela aqui.</p>` : starsHtml}
      ${points > cap ? `<span class="tiny">+${points - cap}</span>` : ''}
    </div>
  `;
}

function renderThemeRow(){
  document.getElementById('theme-row').innerHTML = Object.keys(THEMES).map(id => {
    const t = THEMES[id]; const sel = id === state.theme ? 'selected' : '';
    return `<button type="button" class="theme-chip ${sel}" style="background:${t.bg};color:${t.text};" onclick="selectTheme('${id}')" aria-label="${getGuideName(id)}"><i class="ti ${t.icon}" aria-hidden="true"></i><span style="font-size:10px;">${getGuideName(id)}</span></button>`;
  }).join('');
}

function applyThemeChrome(){
  const t = THEMES[state.theme];
  const card = document.getElementById('app-card');
  if(card) card.style.background = `color-mix(in srgb, ${t.bg} 35%, var(--bg-card))`;
  document.body.style.background = `color-mix(in srgb, ${t.bg} 18%, var(--bg))`;
  const deco = document.getElementById('theme-bg-deco');
  if(!deco) return;
  const icons = THEME_BG_ICONS[state.theme] || [t.icon];
  const positions = [
    'top:6%; left:4%; font-size:64px; transform:rotate(-14deg);',
    'top:36%; right:-14px; font-size:88px; transform:rotate(10deg);',
    'bottom:6%; left:18%; font-size:56px; transform:rotate(9deg);'
  ];
  deco.innerHTML = icons.map((ic,i) => {
    const pos = positions[i % positions.length];
    if(ic === 'TEXT'){
      const chars = ['A','3','B','2','C'];
      return `<span style="position:absolute; ${pos} color:${t.accent}; opacity:0.10; font-family:var(--font-display); font-weight:700;">${chars[i % chars.length]}</span>`;
    }
    return `<i class="ti ${ic}" style="position:absolute; ${pos} color:${t.accent}; opacity:0.10;" aria-hidden="true"></i>`;
  }).join('');
}

  </div>`;
}

let ocrStatusMsg = '';
let ocrBusy = false;

function loadTesseract(){
  return new Promise((resolve, reject) => {
    if(window.Tesseract){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Falha ao carregar o leitor de texto'));
    document.head.appendChild(s);
  });
}

async function handleLabelPhoto(input){
  const file = input.files && input.files[0];
  if(!file) return;
  ocrBusy = true;
  ocrStatusMsg = 'Carregando o leitor de texto...';
  renderLabelView();
  try{
    await loadTesseract();
    ocrStatusMsg = 'Lendo o rótulo, pode levar alguns segundos...';
    renderLabelView();
    const { data } = await Tesseract.recognize(file, 'por');
    const text = ((data && data.text) || '').trim();
    state.labelText = text;
    ocrStatusMsg = text
      ? 'Texto capturado abaixo — confira e corrija antes de verificar. Leitura automática pode errar, principalmente com letra pequena ou embalagem brilhante.'
      : 'Não consegui ler nada nessa foto. Tente de novo com mais luz, ou digite manualmente.';
  }catch(e){
    ocrStatusMsg = 'Não consegui usar o leitor agora. Digite os ingredientes manualmente.';
    console.error('Erro no OCR', e);
  }
  ocrBusy = false;
  renderLabelView();
  scheduleSave();
  input.value = '';
}

function exportBackup(){
  try{
    const dataStr = JSON.stringify(state, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tealimenta-backup-${localDateStr(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }catch(e){
    alert('Não foi possível exportar o backup: ' + e.message);
  }
}

function triggerImportBackup(){
  const input = document.getElementById('import-backup-input');
  if(input) input.click();
}

function importBackup(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let imported;
    try{
      imported = JSON.parse(e.target.result);
    }catch(err){
      alert('Esse arquivo não é um backup válido (não é um JSON legível).');
      return;
    }
    if(!imported || typeof imported !== 'object' || !Array.isArray(imported.meals) || !THEMES[imported.theme]){
      alert('Esse arquivo não parece ser um backup do TEAlimenta.');
      return;
    }
    if(!confirm('Isso vai substituir TODOS os dados salvos neste celular pelos dados do arquivo importado. Essa ação não pode ser desfeita. Continuar?')) return;
    state = imported;
    if(!state.supplementsCreatedAt) state.supplementsCreatedAt = {};
    if(!state.supplementsLastTaken) state.supplementsLastTaken = {};
    renderAll();
    scheduleSave();
    alert('Backup importado com sucesso!');
  };
  reader.onerror = () => alert('Não foi possível ler esse arquivo.');
  reader.readAsText(file);
}

      <div><p class="tiny" style="margin-bottom:6px;font-weight:700;">Criança</p>${numberGridSection('water')}</div>
    </div>

    <p class="section-label">Frequência evacuatória da criança</p>
    <div style="margin-bottom:6px;">${numberGridSection('bowelCount')}</div>
    <div style="display:flex;gap:3px;justify-content:space-between;margin-bottom:8px;">
      ${weekDays.map(d => {
        if(d.isFuture) return `<div style="flex:1;display:flex;justify-content:center;"><div style="width:12px;height:12px;border-radius:50%;border:1px solid var(--border);"></div></div>`;
        const log = getDayLog(d.dateStr);
        const opt = (log.bowelCount > 0 && log.bowelNote && NOTE_OPTIONS[log.bowelNote]) ? NOTE_OPTIONS[log.bowelNote] : null;
        return `<div style="flex:1;display:flex;justify-content:center;"><div style="width:12px;height:12px;border-radius:50%;${opt ? `background:var(--${opt.color}-bg);border:1px solid var(--${opt.color}-text);` : 'border:1px solid var(--border);'}"></div></div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
      ${Object.keys(NOTE_OPTIONS).map(k => {
        const opt = NOTE_OPTIONS[k];
        return `<span style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-soft);"><span style="width:8px;height:8px;border-radius:50%;background:var(--${opt.color}-text);display:inline-block;"></span>${opt.label}</span>`;
      }).join('')}
    </div>

    <div style="background:var(--bg-soft);border-radius:var(--radius-md);padding:12px;margin-bottom:18px;">
      <p style="font-size:13px;font-weight:700;margin:0 0 8px;">Desafios concluídos na semana</p>
      <div style="display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap;">${starsRowHtml(weekStars, 7, t.accent)}</div>
      <p class="tiny">${weekStars}/7 dias concluídos</p>
    </div>

    <button id="print-btn" type="button" onclick="window.print()" style="width:100%;background:${t.accent};color:#fff;border:none;font-weight:700;">Imprimir PDF</button>
  `;
}

function checkLabel(){
  const text = (state.labelText || '').toLowerCase();
  const matches = [];
  allergenKeys().forEach(k => {
    if(!state.allergies[k]) return;
    const keywords = ALLERGEN_KEYWORDS[k] || [allergenLabel(k).toLowerCase()];
    const hit = keywords.find(kw => text.includes(kw));
    if(hit) matches.push(`${allergenLabel(k)} ("${hit}")`);
  });
  state.lastCheck = { safe: matches.length === 0, matches };
  renderLabelView();
  scheduleSave();
}

function fillSample(key){ state.labelText = SAMPLES[key]; renderLabelView(); scheduleSave(); }
function toggleAllergy(k){ state.allergies[k] = !state.allergies[k]; renderLabelView(); renderMomView(); scheduleSave(); }
function addCustomAllergen(){
  const el = document.getElementById('allergen-name-input');
  const name = (el.value || '').trim();
  if(!name) return;
  let key = slugify(name);
  if(ALLERGENS[key] || state.customAllergens[key]) key += Date.now();
  state.customAllergens[key] = name;
  state.allergies[key] = true;
  el.value = '';
  renderMomView(); renderLabelView(); scheduleSave();
}
function removeCustomAllergen(key){
  delete state.customAllergens[key];
  delete state.allergies[key];
  renderMomView(); renderLabelView(); scheduleSave();
}
function renameGuide(v){ state.guideNames[state.theme] = v; renderThemeRow(); renderKidView(); renderPlayView(); renderSleepView(); scheduleSave(); }
function selectTheme(id){ state.theme = id; renderAll(); scheduleSave(); }

function incWater(){ if(state.water < state.waterGoal){ state.water++; renderKidView(); renderMomView(); renderRewards(); renderReportView(); scheduleSave(); } }
function incMeal(){ if(state.meal < state.meals.length){ state.meal++; renderKidView(); renderMomView(); renderRewards(); renderReportView(); scheduleSave(); } }
function setWaterCup(i){ const target = i+1; state.water = (state.water === target) ? i : target; renderKidView(); renderMomView(); renderRewards(); renderReportView(); scheduleSave(); }
function setMealCup(i){ const target = i+1; state.meal = (state.meal === target) ? i : target; renderKidView(); renderMomView(); renderRewards(); renderReportView(); scheduleSave(); }

function incMomWater(){ if(state.momWater < state.momWaterGoal){ state.momWater++; renderMomView(); renderReportView(); scheduleSave(); } }
function incMomMeal(){ if(state.momMeal < state.momMealGoal){ state.momMeal++; renderMomView(); renderReportView(); scheduleSave(); } }
function setMomWaterCup(i){ const target = i+1; state.momWater = (state.momWater === target) ? i : target; renderMomView(); renderReportView(); scheduleSave(); }
function setMomMealCup(i){ const target = i+1; state.momMeal = (state.momMeal === target) ? i : target; renderMomView(); renderReportView(); scheduleSave(); }

function addSupplement(){
  const nameEl = document.getElementById('supp-name-input'), timeEl = document.getElementById('supp-time-input');
  const name = (nameEl.value || '').trim();
  if(!name) return;
  const id = slugify(name) + '-' + Date.now();
  state.supplements.push({ id, name, time: timeEl.value || '08:00' });
  if(!state.supplementsCreatedAt) state.supplementsCreatedAt = {};
  state.supplementsCreatedAt[id] = new Date().toISOString();
  nameEl.value = '';
  renderSupplementsView(); scheduleSave();
}
function removeSupplement(id){
  state.supplements = state.supplements.filter(s => s.id !== id);
  delete state.supplementsTaken[id];
  if(state.supplementsLastTaken) delete state.supplementsLastTaken[id];
  if(state.supplementsCreatedAt) delete state.supplementsCreatedAt[id];
  delete state.alertsFiredToday.supplements[id];
  renderSupplementsView(); renderRewards(); scheduleSave();
}
function updateSupplementTime(id, v){
  const s = state.supplements.find(s => s.id === id);
  if(s) s.time = v;
  // Horário mudou: trata como uma nova referência, senão o horário antigo poderia
  // ficar "preso" a um cálculo baseado no horário anterior.
  if(!state.supplementsCreatedAt) state.supplementsCreatedAt = {};
  state.supplementsCreatedAt[id] = new Date().toISOString();
  if(state.supplementsLastTaken) delete state.supplementsLastTaken[id];
  renderSupplementsView(); scheduleSave();
}
function toggleSupplementTaken(id){
  const takenNow = !state.supplementsTaken[id];
  state.supplementsTaken[id] = takenNow;
  if(!state.supplementsLastTaken) state.supplementsLastTaken = {};
  if(takenNow){
    state.supplementsLastTaken[id] = new Date().toISOString();
  }else{
    delete state.supplementsLastTaken[id];
  }
  if(state.alertsFiredToday && state.alertsFiredToday.supplements) delete state.alertsFiredToday.supplements[id];
  renderSupplementsView(); renderRewards(); scheduleSave();
}
function updateMealTime(i,v){ state.meals[i].time = v; renderMomView(); renderKidView(); scheduleSave(); }
function updateMealLabel(i,v){
  const label = (v||'').trim();
  if(!label){ renderMomView(); return; }
  state.meals[i].label = label;
  renderMomView(); renderKidView(); renderReportView(); scheduleSave();
}
function addMeal(){
  const nameEl = document.getElementById('new-meal-name-input');
  const timeEl = document.getElementById('new-meal-time-input');
  const label = (nameEl.value || '').trim();
  if(!label) return;
  const id = slugify(label) + '-' + Date.now();
  state.meals.push({ id, label, time: timeEl.value || '12:00', icon: 'ti-tools-kitchen-2' });
  nameEl.value = '';
  renderMomView(); renderKidView(); renderReportView(); scheduleSave();
}
function removeMeal(i){
  if(state.meals.length <= 1){ alert('Precisa ter pelo menos uma refeição cadastrada.'); return; }
  if(!confirm(`Remover "${state.meals[i].label}" da lista de refeições?`)) return;
  state.meals.splice(i, 1);
  // Se a refeição removida já tinha sido marcada como feita hoje, ajusta a
  // contagem pra não ficar "adiantada" em relação ao que realmente existe.
  if(state.meal > i) state.meal = Math.max(0, state.meal - 1);
  state.alertsFiredToday.meals = new Array(state.meals.length).fill(false);
  renderMomView(); renderKidView(); renderReportView(); scheduleSave();
}

function toggleChew(){ state.chew.active = !state.chew.active; renderKidView(); }
function chewTap(){
  if(state.chew.count < state.chew.goalMax){
    state.chew.count++;
    if(state.chew.count === state.chew.goalMin){ state.chewCompletions++; renderRewards(); }
  }
  renderKidView();
  scheduleSave();
}
function resetChew(){ state.chew.count = 0; renderKidView(); scheduleSave(); }

function toggleSleepStep(i){ state.sleep.stepDone[i] = !state.sleep.stepDone[i]; renderSleepView(); scheduleSave(); }
function finishSleep(){
  if(state.sleep.stepDone.filter(Boolean).length < SLEEP_MIN) return;
  state.sleepRoundsToday++;
  state.sleep.stepDone = new Array(SLEEP_STEPS.length).fill(false);
  renderSleepView(); renderMomView(); renderRewards(); renderReportView(); scheduleSave();
}

function selectFood(k){ state.challenge.food = k; state.challenge.selected = null; renderPlayView(); scheduleSave(); }
function setChallengeFeedback(val){ state.challengeFeedback = (state.challengeFeedback === val) ? null : val; renderPlayView(); scheduleSave(); }
function selectStep(i){ state.challenge.selected = (state.challenge.selected === i) ? null : i; renderPlayView(); scheduleSave(); }
function finishChallenge(){
  if(state.challenge.selected === null) return;
  state.challengeRoundsToday++;
  state.challenge.selected = null;
  renderPlayView(); renderRewards(); renderReportView(); scheduleSave();
}

function slugify(s){
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'') || ('alimento' + Date.now());
}
function addFood(inputId){
  const el = document.getElementById(inputId || 'food-name-input');
  const name = (el.value || '').trim();
  if(!name) return;
  let key = slugify(name);
  if(state.foods[key]) key += Date.now();
  state.foods[key] = { label: name, icon: 'ti-apple' };
  el.value = '';
  renderMomView(); renderPlayView(); scheduleSave();
}
function removeFood(key){
  if(Object.keys(state.foods).length <= 1) return;
  delete state.foods[key];
  if(state.challenge.food === key){ state.challenge.food = Object.keys(state.foods)[0]; }
  renderMomView(); renderPlayView(); scheduleSave();
}

function setBowelNote(k){
  state.bowel.noteSel = k;
  const todayStr = localDateStr(new Date());
  if(state.bowel.byDate[todayStr]) state.bowel.byDate[todayStr].note = k;
  renderBowelView(); renderReportView(); scheduleSave();
}
function setBowelCount(n){
  const todayStr = localDateStr(new Date());
  if(!state.bowel.byDate[todayStr]) state.bowel.byDate[todayStr] = { count:0, note: state.bowel.noteSel };
  const entry = state.bowel.byDate[todayStr];
  entry.count = (entry.count === n) ? 0 : n;
  entry.note = state.bowel.noteSel;
  renderBowelView(); renderReportView(); scheduleSave();
}

function setRestCategory(k){ state.restCategorySel = k; renderRestaurantView(); }
function addRestaurant(){
  const nameEl = document.getElementById('rest-name-input'), noteEl = document.getElementById('rest-note-input');
  const name = (nameEl.value || '').trim();
  if(!name) return;
  state.restaurants.unshift({ name, note:(noteEl.value || '').trim(), date: localDateStr(new Date()), category: state.restCategorySel || 'outro' });
  nameEl.value = ''; noteEl.value = '';
  renderRestaurantView(); scheduleSave();
}
function removeRestaurant(i){ state.restaurants.splice(i,1); renderRestaurantView(); scheduleSave(); }

function setView(v){
  state.view = v;
  if(v === 'report') renderReportView();
  if(v !== 'pause' && breathInterval){ clearInterval(breathInterval); breathInterval = null; }
  ['kid','menu','sleep','play','supplements','label','bowel','restaurant','report','pause','mom'].forEach(k => {
    document.getElementById('seg-'+k).classList.toggle('active', v === k);
    document.getElementById(k+'-view').style.display = v === k ? 'block' : 'none';
  });
}

function renderAll(){
  applyThemeChrome();
  renderRewards(); renderThemeRow(); renderKidView(); renderMenuView(); renderSleepView(); renderPlayView(); renderSupplementsView(); renderLabelView(); renderBowelView(); renderRestaurantView(); renderPauseView(); renderMomView(); renderReportView();
  setView(state.view);
}

loadState();
initPush();
</script>
</body>
</html>
